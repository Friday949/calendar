<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14171c; --cell:#1e232b; --off:#171a20; --text:#f2f4f7; --dim:#8a93a0; --today:#ffffff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif; }
  #app { height:100%; display:flex; flex-direction:column; padding:2.2vh 2vw; }
  #top { display:flex; align-items:center; justify-content:space-between; height:6.4vh; padding:0 0.5vw; margin-bottom:1.6vh; }
  #title { font-size:4.9vh; font-weight:700; letter-spacing:0.02em; }
  #legend { display:flex; gap:1.2vw; }
  .key { display:flex; align-items:center; font-size:3vh; font-weight:500; }
  .key i { display:inline-block; width:2.6vh; height:2.6vh; margin-right:0.5vw; border-radius:3px; }
  #grid { flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:0.5vh 0.4vw; min-height:0; }
  .dow { font-size:3vh; font-weight:700; color:var(--dim); padding:0 0.6vw; }
  .day { background:var(--cell); border-radius:6px; padding:0.5vh 0.5vw; min-height:0; overflow:hidden;
    display:flex; flex-direction:column; }
  .day.off { background:var(--off); }
  .day.past { opacity:0.45; }
  .day.today { outline:0.5vh solid var(--today); outline-offset:-0.5vh; }
  .num { font-size:3.2vh; font-weight:700; color:var(--dim); line-height:1; margin-bottom:0.4vh; }
  .today .num { color:var(--today); }
  .ev { flex:1 1 0; min-height:0; max-height:4.6vh; margin-top:0.35vh; padding:0 0.5vw; border-radius:4px;
    color:#101317; font-weight:700; font-size:2.8vh; line-height:1; display:flex; align-items:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev span { flex:none; white-space:nowrap; }
  #status { position:fixed; right:1vw; bottom:0.5vh; font-size:1.8vh; color:var(--dim); }
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="title"></div><div id="legend"></div></div>
  <div id="grid"></div>
</div>
<div id="status"></div>

<script>
// ===== SETTINGS: edit these =====
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQH5ZRIgszO3TFfN-GeVeZ03PF5Nwhu5Az4483itlnK6LfaRSN6jPdilrXUal03W6qateMjWvKd4VrZ/pub?output=csv";            // paste your Google Sheet "Publish to web" CSV link here (leave empty to see demo data)
var SECONDS_PER_MONTH = 6;  // how long each month stays on screen
var MONTHS_TO_SHOW = 2;      // current month plus the next 2
var REFRESH_MINUTES = 1;     // how often to re-read the sheet
var PRESS_NAMES = ["EF1", "EF2", "EF3", "EF4", "FA26", "P5"]; // your press names, in order
var PRESS_COLORS = ["#f5b82e", "#3ec1d3", "#ff7a59", "#8bd450", "#c58bff", "#ff6fb1"]; // one color per press, same order as the names
// =================================

var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
var events = {};   // "y-m-d" -> [{press, label}]
var step = 0;
var lastText = null, pendingText = null;

function key(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function parseDate(s) {
  s = (s || "").replace(/^\s+|\s+$/g, "");
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) { var y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1] - 1, +m[2]); }
  return null;
}

function parseCSV(text) {
  var rows = [], row = [], cell = "", q = false, i, c;
  for (i = 0; i < text.length; i++) {
    c = text.charAt(i);
    if (q) {
      if (c === '"') { if (text.charAt(i + 1) === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function buildEvents(rows) {
  var out = {}, h = rows[0] || [], col = {start:-1, end:-1, press:-1, job:-1}, i, j;
  for (i = 0; i < h.length; i++) {
    var n = h[i].toLowerCase();
    if (n.indexOf("start") > -1 || n === "date") col.start = i;
    else if (n.indexOf("end") > -1) col.end = i;
    else if (n.indexOf("press") > -1) col.press = i;
    else if (n.indexOf("project") > -1 || n.indexOf("job") > -1) col.job = i;
  }
  for (i = 1; i < rows.length; i++) {
    var r = rows[i], s = parseDate(r[col.start]);
    if (!s) continue;
    var e = col.end > -1 ? parseDate(r[col.end]) : null;
    if (!e || e < s) e = s;
    var press = (r[col.press] || "").replace(/^\s+|\s+$/g, "");
    var label = (r[col.job] || "").replace(/^\s+|\s+$/g, "");
    var span = [], d = new Date(s.getFullYear(), s.getMonth(), s.getDate());
    for (j = 0; j < 60 && d <= e; j++) {
      if (d.getDay() > 0 && d.getDay() < 6) span.push(new Date(d.getTime()));
      d.setDate(d.getDate() + 1);
    }
    for (j = 0; j < span.length; j++) {
      var k = key(span[j]);
      (out[k] = out[k] || []).push({
        press: press,
        label: label
      });
    }
  }
  return out;
}

function demoData() {
  var t = new Date(), y = t.getFullYear(), m = t.getMonth() + 1;
  function ds(d) { return y + "-" + m + "-" + d; }
  return [["Start Date","End Date","Press","Project"],
    [ds(3),"","1","Job 4471"],[ds(3),"","3","Label run"],[ds(5),ds(7),"2","Die test 8802"],
    [ds(10),"","4","Rush 5530"],[ds(10),"","5","Sample 12"],[ds(12),"","1","Job 4502"],
    [ds(18),ds(19),"3","Retool 77"],[ds(24),"","2","Job 4620"]];
}

// Matches a sheet entry to a press by name (not case-sensitive) or by position number (1 to 5)
function pressNum(p) {
  var s = String(p).toLowerCase().replace(/[\s\-]/g, ""), i;
  for (i = 0; i < PRESS_NAMES.length; i++) if (PRESS_NAMES[i].toLowerCase().replace(/[\s\-]/g, "") === s) return i + 1;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  return 99;
}
function colorFor(p) { return PRESS_COLORS[pressNum(p) - 1] || "#cfd5dd"; }
function pressTag(p) { return PRESS_NAMES[pressNum(p) - 1] || p; }

function renderLegend() {
  var h = "", i;
  for (i = 0; i < PRESS_COLORS.length; i++) h += '<div class="key"><i style="background:' + PRESS_COLORS[i] + '"></i>' + esc(PRESS_NAMES[i] || "") + "</div>";
  document.getElementById("legend").innerHTML = h;
}

function render() {
  var today = new Date(), t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var first = new Date(today.getFullYear(), today.getMonth() + (step % MONTHS_TO_SHOW), 1);
  var last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  document.getElementById("title").innerHTML = MONTH_NAMES[first.getMonth()] + " " + first.getFullYear() + " - Upcoming Projects";

  var start = new Date(first.getTime());
  var back = (start.getDay() + 6) % 7;           // days since Monday
  start.setDate(start.getDate() - back);

  var html = "", i, weeks = 0;
  for (i = 0; i < 5; i++) html += '<div class="dow">' + DAYS[i] + "</div>";

  var wk = new Date(start.getTime());
  while (wk <= last) {
    weeks++;
    for (i = 0; i < 5; i++) {
      var d = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() + i);
      var inMonth = d.getMonth() === first.getMonth();
      var cls = "day" + (inMonth ? "" : " off") + (inMonth && d < t0 ? " past" : "") + (inMonth && d.getTime() === t0.getTime() ? " today" : "");
      html += '<div class="' + cls + '">';
      if (inMonth) {
        html += '<div class="num">' + d.getDate() + "</div>";
        var list = (events[key(d)] || []).slice().sort(function (a, b) { return pressNum(a.press) - pressNum(b.press); });
        var j;
        for (j = 0; j < list.length; j++) {
          html += '<div class="ev" style="background:' + colorFor(list[j].press) + '">' + "<span>" + esc(pressTag(list[j].press)) + "&nbsp;-&nbsp;" + esc(list[j].label) + "</span></div>";
        }
      }
      html += "</div>";
    }
    wk.setDate(wk.getDate() + 7);
  }
  var g = document.getElementById("grid");
  g.style.gridTemplateRows = "auto repeat(" + weeks + ", 1fr)";
  g.innerHTML = html;
  fitText();
}

// Shrinks long entries so they fit on one line (never below 55% of normal size)
function fitText() {
  var els = document.getElementById("grid").getElementsByClassName("ev"), i;
  for (i = 0; i < els.length; i++) {
    var el = els[i], span = el.firstChild; el.style.fontSize = ""; var cs = window.getComputedStyle(el);
    var size = parseFloat(cs.fontSize), min = size * 0.55;
    var avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    while (span.offsetWidth > avail && size > min) { size -= 0.5; el.style.fontSize = size + "px"; }
  }
}
window.onresize = fitText;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

function load() {
  if (!CSV_URL) { events = buildEvents(demoData()); render(); return; }
  var x = new XMLHttpRequest();
  x.open("GET", CSV_URL + (CSV_URL.indexOf("?") > -1 ? "&" : "?") + "t=" + new Date().getTime(), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status === 200) {
      document.getElementById("status").innerHTML = "";
      var txt = x.responseText;
      // Google sometimes serves an older copy. Only switch to new data once two fetches in a row agree.
      if (lastText === null || txt === pendingText) {
        lastText = txt; pendingText = null;
        events = buildEvents(parseCSV(txt));
        render();
      } else if (txt === lastText) {
        pendingText = null;
      } else {
        pendingText = txt;
      }
    } else {
      document.getElementById("status").innerHTML = "Can’t reach the sheet. Showing last known schedule.";
    }
  };
  x.send();
}

renderLegend();
load();
setInterval(function () { step++; render(); }, SECONDS_PER_MONTH * 1000);
setInterval(load, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
